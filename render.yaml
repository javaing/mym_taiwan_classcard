services:
  - type: web
    name: mym-taiwan-classcard
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: master
    envVars:
      - key: APP_NAME
        value: MYM_Taiwan
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mongodb
      - key: DB_DSN
        sync: false
      - key: DB_DATABASE
        value: MYMTW_CardInfo
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_SECRET
        sync: false
      - key: LINE_CHANNEL_ID2
        sync: false
      - key: LINE_SECRET2
        sync: false
      - key: SESSION_DRIVER
        value: cookie
      # HTTPS + LINE iOS WebView：Secure 必須開。不要設 SESSION_DOMAIN
      #（.onrender.com 會把 cookie 洩到其他 Render 站台）。
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: "none"
      - key: PORT
        value: "80"
